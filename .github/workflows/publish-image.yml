name: Eventflow CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: eventflow-backend
  AWS_ACCOUNT_ID: '751900120658'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751900120658:role/GitHubActionsEventflowRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image information
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_uri }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751900120658:role/GitHubActionsEventflowRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 using Systems Manager
        run: |
          cat > /tmp/eventflow-ssm-params.json <<'EOF'
          {
            "commands": [
              "set -e",
              "mkdir -p /opt/eventflow",
              "curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /opt/eventflow/global-bundle.pem",
              "DATABASE_URL=$(aws ssm get-parameter --name /eventflow/production/DATABASE_URL --with-decryption --region eu-north-1 --query Parameter.Value --output text)",
              "JWT_ACCESS_SECRET=$(aws ssm get-parameter --name /eventflow/production/JWT_ACCESS_SECRET --with-decryption --region eu-north-1 --query Parameter.Value --output text)",
              "umask 077",
              "printf 'DATABASE_URL=%s\\nJWT_ACCESS_SECRET=%s\\nJWT_ACCESS_EXPIRES_IN=15m\\nREFRESH_TOKEN_EXPIRES_IN_DAYS=7\\n' \"$DATABASE_URL\" \"$JWT_ACCESS_SECRET\" > /opt/eventflow/backend.env",
              "unset DATABASE_URL JWT_ACCESS_SECRET",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 751900120658.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull ${{ needs.build-and-push.outputs.image_uri }}",
              "docker run --rm --env-file /opt/eventflow/backend.env -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem -v /opt/eventflow/global-bundle.pem:/app/global-bundle.pem:ro ${{ needs.build-and-push.outputs.image_uri }} npx prisma migrate deploy",
              "docker rm -f eventflow-api-test || true",
              "docker rm -f eventflow-api || true",
              "docker run -d --name eventflow-api --restart unless-stopped --env-file /opt/eventflow/backend.env -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem -v /opt/eventflow/global-bundle.pem:/app/global-bundle.pem:ro -p 127.0.0.1:3000:3000 ${{ needs.build-and-push.outputs.image_uri }}",
             "HEALTHY=0; for i in $(seq 1 15); do if curl -fsS http://127.0.0.1:3000/api >/dev/null; then echo 'Backend health check passed'; HEALTHY=1; break; fi; sleep 2; done; if [ \"$HEALTHY\" -ne 1 ]; then echo 'Backend health check failed'; docker logs --tail 100 eventflow-api; exit 1; fi",
             "docker image prune -af"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09fca9ef27e2955e6" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/eventflow-ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09fca9ef27e2955e6"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09fca9ef27e2955e6"
